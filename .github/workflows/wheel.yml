name: wheel

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the wheel
        run: uv build
      - name: Install the wheel on Linux
        if: runner.os != 'Windows'
        run: |
          scripts/install.sh --wheel dist/*.whl --prefix .install-test --no-init
          .install-test/bin/downcroc --version
      - name: Install the wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Wheel (Get-ChildItem dist\*.whl).FullName -Prefix .install-test -NoInit
          .install-test\bin\downcroc.cmd --version
      - uses: actions/upload-artifact@v4
        with:
          name: downcroc-wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

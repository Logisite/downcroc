name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install build tooling
        run: uv sync --frozen --group build --no-dev
      - name: Build the PyInstaller artifact
        run: uv run --no-sync python scripts/build_binary.py pyinstaller --out dist/pyinstaller
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: downcroc-${{ runner.os }}
          path: dist/pyinstaller/downcroc
          if-no-files-found: error

[project]
name = "downcroc"
version = "1.2.1"
description = "Always-on local mail daemon for personalised mail from your own accounts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Logisite", email = "divinechinemeremeke@gmail.com" }
]
keywords = ["email", "smtp", "imap", "mail", "daemon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cbor2>=6.1.5",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "imap-tools>=1.16.0",
    "keyring>=25.7.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[project.scripts]
downcroc = "downcroc.cli.main:main"

[project.urls]
Homepage = "https://github.com/Logisite/downcroc"
Repository = "https://github.com/Logisite/downcroc"
Issues = "https://github.com/Logisite/downcroc/issues"
Documentation = "https://github.com/Logisite/downcroc#readme"
Changelog = "https://github.com/Logisite/downcroc/blob/master/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "nuitka>=4.3.1",
    "pyinstaller>=6.22.3",
]
dev = [
    "nuitka>=4.3.1",
    "pyinstaller>=6.22.3",
    "pyte>=0.8.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project]
name = "downcroc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "logisite", email = "divinechinemeremeke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
downcroc = "downcroc.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
